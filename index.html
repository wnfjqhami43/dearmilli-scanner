<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>디어밀리 ERP 바코드 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    .status {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
    }

    .barcode {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
      white-space: pre-line;
    }

    .product {
      margin-top: 15px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      line-height: 1.8;
    }

    .product-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 7px 0;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
      margin-left: 15px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .success {
      color: #16803c;
    }

    .warning {
      color: #c77700;
    }

    .error {
      color: #c62828;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 디어밀리 ERP</h1>


  <div id="reader"></div>


  <div id="status"
       class="status">

    아래 버튼을 눌러 카메라를 시작해주세요.

  </div>


  <div id="barcode"
       class="barcode hidden">
  </div>


  <div id="product"
       class="product hidden">

    <div class="product-title">
      📦 상품정보
    </div>

    <div class="row">
      <span class="label">SKU</span>
      <span class="value" id="sku"></span>
    </div>

    <div class="row">
      <span class="label">브랜드</span>
      <span class="value" id="brand"></span>
    </div>

    <div class="row">
      <span class="label">모델명</span>
      <span class="value" id="modelName"></span>
    </div>

    <div class="row">
      <span class="label">모델코드</span>
      <span class="value" id="modelCode"></span>
    </div>

    <div class="row">
      <span class="label">사이즈</span>
      <span class="value" id="size"></span>
    </div>

    <div class="row">
      <span class="label">성별</span>
      <span class="value" id="gender"></span>
    </div>

    <div class="row">
      <span class="label">상품DB 매입가</span>
      <span class="value" id="purchasePrice"></span>
    </div>

       <div class="row">
      <span class="label">현재재고</span>
      <span class="value" id="currentStock"></span>
    </div>

  </div>


  <!-- ==========================================
       입고 등록
  =========================================== -->

  <div id="inboundForm"
       class="product hidden">

    <div class="product-title">
      📦 입고 등록
    </div>


    <!-- 입고수량 -->

    <div style="margin-top:15px;">

      <label style="display:block;
                    margin-bottom:6px;
                    color:#777;">

        입고수량

      </label>

      <input
        type="number"
        id="inboundQuantity"
        value="1"
        min="1"
        step="1"
        inputmode="numeric"
        style="
          width:100%;
          padding:14px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:17px;
        "
      >

    </div>


    <!-- 실제 매입가 -->

    <div style="margin-top:15px;">

      <label style="display:block;
                    margin-bottom:6px;
                    color:#777;">

        실제 매입가

      </label>

      <input
        type="number"
        id="inboundPurchasePrice"
        min="0"
        step="100"
        inputmode="numeric"
        placeholder="실제 구입가격 입력"
        style="
          width:100%;
          padding:14px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:17px;
        "
      >

    </div>


    <!-- 공급처 -->

    <div style="margin-top:15px;">

      <label style="display:block;
                    margin-bottom:6px;
                    color:#777;">

        공급처

      </label>

      <select
        id="inboundSupplier"
        style="
          width:100%;
          padding:14px;
          border:1px solid #ddd;
          border-radius:10px;
          font-size:17px;
          background:white;
        "
      >

        <option value="">공급처 선택</option>

        <option value="CST">코스트코</option>
        <option value="HP-K">현대프리미엄아울렛 김포</option>
        <option value="HP-S">현대프리미엄아울렛 송도</option>
        <option value="SSO-SH">신세계아울렛시흥</option>
        <option value="NKO">나이키 공홈</option>
        <option value="NBO">뉴발란스 공홈</option>
        <option value="ABC">ABC마트</option>
        <option value="LTD">롯데백화점</option>
        <option value="SSG">신세계백화점</option>
        <option value="MUS">무신사</option>

      </select>

    </div>


    <!-- 입고 등록 버튼 -->

    <button
      id="inboundButton"
      onclick="registerInboundFromPhone()">

      🟢 입고 등록

    </button>

  </div>


  <button id="startButton"
          onclick="startScanner()">

    📷 카메라 시작

  </button>


  <button id="againButton"
          class="hidden"
          onclick="startScanner()">

    📷 다시 스캔

  </button>
    <!-- ==========================================
         판매 등록
    =========================================== -->

    <div
      id="salesForm"
      class="product hidden"
      style="margin-top:20px;"
    >

      <div class="product-title">
        📤 판매 등록
      </div>


      <!-- 판매수량 -->

      <div style="margin-top:15px;">

        <label style="display:block;
                      margin-bottom:6px;
                      color:#777;">

          판매수량

        </label>

        <input
          type="number"
          id="salesQuantity"
          value="1"
          min="1"
          step="1"
          inputmode="numeric"
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:17px;
          "
        >

      </div>


      <!-- 판매처 -->

      <div style="margin-top:15px;">

        <label style="display:block;
                      margin-bottom:6px;
                      color:#777;">

          판매처

        </label>

        <select
          id="salesPlatform"
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:17px;
            background:white;
          "
        >

          <option value="">
            판매처 불러오는 중...
          </option>

        </select>

      </div>


      <!-- 판매가 -->

      <div style="margin-top:15px;">

        <label style="display:block;
                      margin-bottom:6px;
                      color:#777;">

          판매가

        </label>

        <input
          type="number"
          id="salesPrice"
          min="0"
          step="100"
          inputmode="numeric"
          placeholder="총 판매금액 입력"
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:17px;
          "
        >

      </div>


      <!-- 배송비 -->

      <div style="margin-top:15px;">

        <label style="display:block;
                      margin-bottom:6px;
                      color:#777;">

          배송비

        </label>

        <input
          type="number"
          id="salesShipping"
          value="0"
          min="0"
          step="100"
          inputmode="numeric"
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:17px;
          "
        >

      </div>


      <!-- 비고 -->

      <div style="margin-top:15px;">

        <label style="display:block;
                      margin-bottom:6px;
                      color:#777;">

          비고

        </label>

        <input
          type="text"
          id="salesMemo"
          placeholder="필요한 경우 입력"
          style="
            width:100%;
            padding:14px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:17px;
          "
        >

      </div>


      <!-- 판매 등록 버튼 -->

      <button
        id="salesButton"
        onclick="registerSalesFromPhone()"
        style="margin-top:18px;">

        🔵 판매 등록

      </button>

    </div>
</div>


<script>


/* ==========================================
   ERP 웹앱 주소
========================================== */

const ERP_API_URL =
"https://script.google.com/macros/s/AKfycbzXviTT0QNrWy018CzCZWpR2erIxUkpk1tPJLd117WC0Pp7-HY7Lw12YHCbj9JcNCPX/exec";


let scanner = null;

let scanned = false;


/* ==========================================
   카메라 시작
========================================== */

function startScanner() {

  scanned = false;


  document
    .getElementById("product")
    .classList.add("hidden");


  document
    .getElementById("barcode")
    .classList.add("hidden");


  document
    .getElementById("againButton")
    .classList.add("hidden");


  document
    .getElementById("startButton")
    .classList.add("hidden");


  setStatus(
    "📷 카메라를 시작하는 중입니다...",
    ""
  );


  if (scanner) {

    scanner.clear()
      .catch(function() {})
      .finally(function() {

        createScanner();

      });

  } else {

    createScanner();

  }

}


/* ==========================================
   스캐너 생성
========================================== */

function createScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
    width: 280,
    height: 120
     },
      
      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]
    },

    function(decodedText) {

      onScanSuccess(decodedText);

    },

    function(errorMessage) {

      // 계속 스캔 중이므로 무시

    }

  )

  .then(function() {

    setStatus(
      "📷 카메라가 켜졌습니다.<br>" +
      "상품 바코드를 화면 안에 맞춰주세요.",
      ""
    );

  })

  .catch(function(error) {

    console.log(error);

    setStatus(
      "❌ 카메라를 사용할 수 없습니다.<br><br>" +
      "카메라 권한을 확인해주세요.",
      "error"
    );

    document
      .getElementById("startButton")
      .classList.remove("hidden");

  });

}


/* ==========================================
   바코드 인식
========================================== */

function onScanSuccess(decodedText) {

  if (scanned) return;

  scanned = true;


  const barcode =
    String(decodedText).trim();


  document
    .getElementById("barcode")
    .classList.remove("hidden");


  document
    .getElementById("barcode")
    .innerText =
      "인식된 바코드\n" + barcode;


  setStatus(
    "🔍 상품DB에서 상품을 검색하는 중입니다...",
    ""
  );


  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(error);

      });

  }


  searchProduct(barcode);

}


/* ==========================================
   상품DB 검색
========================================== */

function searchProduct(barcode) {


  /*
   * 매번 새로운 callback 이름 생성
   */

  const callbackName =
    "dearmilliCallback_" +
    Date.now();


  /*
   * timeout
   */

  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;


      if (window[callbackName]) {

        delete window[callbackName];

      }


      setStatus(
        "❌ ERP 서버 응답 시간이 초과되었습니다.<br><br>" +
        "잠시 후 다시 스캔해주세요.",
        "error"
      );


      document
        .getElementById("againButton")
        .classList.remove("hidden");


    }, 15000);


  /*
   * JSONP callback
   */

  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


     try {

  showProductResult(result);

}

catch(error) {

  console.error(
    "상품정보 표시 오류:",
    error
  );

  /*
   * 상품정보가 이미 정상적으로 표시된 경우에는
   * 전체 화면을 오류 상태로 바꾸지 않는다.
   */

  const productBox =
    document.getElementById("product");

  if (
    !productBox ||
    productBox.classList.contains("hidden")
  ) {

    setStatus(
      "❌ 상품정보를 표시하는 중 오류가 발생했습니다.",
      "error"
    );

  }

}


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  /*
   * API script 생성
   */

  const script =
    document.createElement("script");


  const url =
    ERP_API_URL +
    "?action=product" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  console.log("API 요청:", url);


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      setStatus(
        "❌ ERP 서버에 연결할 수 없습니다.<br><br>" +
        "API 응답을 확인해주세요.",
        "error"
      );


      document
        .getElementById("againButton")
        .classList.remove("hidden");

    };


  document.body.appendChild(script);

}


/* ==========================================
   상품 검색 결과
========================================== */

function showProductResult(result) {


  console.log("상품 검색 결과:", result);


  if (!result) {

    showError(
      "상품 검색 결과가 없습니다."
    );

    return;

  }


  if (!result.success) {

    showError(
      result.message ||
      "상품 검색에 실패했습니다."
    );

    return;

  }


  /* ========================================
     등록된 상품
  ======================================== */

  if (result.registered) {

    const p =
      result.product;


    setStatus(
      "✅ 상품DB에서 상품을 찾았습니다.",
      "success"
    );


    document.getElementById("sku").innerText =
      p.sku || "-";


    document.getElementById("brand").innerText =
      p.brand || "-";


    document.getElementById("modelName").innerText =
      p.modelName || "-";


    document.getElementById("modelCode").innerText =
      p.modelCode || "-";


    document.getElementById("size").innerText =
      p.size || "-";


    document.getElementById("gender").innerText =
      p.gender || "-";


    document.getElementById("purchasePrice").innerText =
      formatNumber(p.purchasePrice) +
      "원";


    document.getElementById("currentStock").innerText =
      formatNumber(p.currentStock) +
      "개";


    document
      .getElementById("product")
      .classList.remove("hidden");

  }


  /* ========================================
     미등록 상품
  ======================================== */

  else {

    setStatus(
      "⚠️ 상품DB에 없는 바코드입니다.",
      "warning"
    );

  }


  document
  .getElementById("againButton")
  .classList.remove("hidden");


// 등록된 상품일 때만 입고등록 표시
if (result.registered) {

  document
    .getElementById("inboundForm")
    .classList.remove("hidden");


  /*
   * 상품DB 매입가를
   * 실제 매입가 입력칸에 기본값으로 넣기
   */

  document.getElementById(
    "inboundPurchasePrice"
  ).value =
    result.product.purchasePrice || 0;

}
  
}


/* ==========================================
   오류
========================================== */

function showError(message) {

  setStatus(
    "❌ " + message,
    "error"
  );


  document
    .getElementById("againButton")
    .classList.remove("hidden");

}


/* ==========================================
   상태 표시
========================================== */

function setStatus(message, type) {

  const status =
    document.getElementById("status");


  status.innerHTML =
    message;


  status.className =
    "status";


  if (type) {

    status.classList.add(type);

  }

}


/* ==========================================
   숫자 표시
========================================== */

function formatNumber(value) {

  return (
    Number(value) || 0
  ).toLocaleString("ko-KR");

}/*==========================================
   휴대폰 입고 등록
========================================== */

function registerInboundFromPhone() {

  const barcodeText =
    document.getElementById("barcode").innerText;


  /*
   * "인식된 바코드" 아래의 실제 값 추출
   */

  const barcodeLines =
    barcodeText.split("\n");


  const barcode =
    String(
      barcodeLines[1] || ""
    ).trim();


  const quantity =
    Number(
      document.getElementById(
        "inboundQuantity"
      ).value
    ) || 0;


  const purchasePrice =
    Number(
      document.getElementById(
        "inboundPurchasePrice"
      ).value
    ) || 0;


  const supplier =
    document.getElementById(
      "inboundSupplier"
    ).value;


  /*
   * 입력값 확인
   */

  if (!barcode) {

    alert(
      "바코드를 확인할 수 없습니다."
    );

    return;

  }


  if (quantity <= 0) {

    alert(
      "입고수량을 입력해주세요."
    );

    return;

  }


  if (purchasePrice < 0) {

    alert(
      "실제 매입가를 확인해주세요."
    );

    return;

  }


  if (!supplier) {

    alert(
      "공급처를 선택해주세요."
    );

    return;

  }


  /*
   * 버튼 잠금
   */

  const button =
    document.getElementById(
      "inboundButton"
    );


  button.disabled = true;

  button.innerText =
    "⏳ 입고 등록 중...";


  /*
   * JSONP callback
   */

  const callbackName =
    "inboundCallback_" +
    Date.now();


  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      button.disabled = false;

      button.innerText =
        "🟢 입고 등록";


      alert(
        "입고 등록 시간이 초과되었습니다."
      );

    }, 15000);


  /*
   * 서버 응답
   */

  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      try {

        if (
          result &&
          result.success
        ) {

          /*
           * 등록 성공
           */

          alert(
            "✅ 입고 등록 완료!\n\n" +
            "입고번호: " +
            (result.inboundNumber || "-") +
            "\nSKU: " +
            (result.sku || "-") +
            "\n입고수량: " +
            formatNumber(
              result.quantity
            ) +
            "개\n실제 매입가: " +
            formatNumber(
              result.purchasePrice
            ) +
            "원\n현재재고: " +
            formatNumber(
              result.currentStock
            ) +
            "개"
          );


          /*
           * 화면의 현재재고도 갱신
           */

          document.getElementById(
            "currentStock"
          ).innerText =
            formatNumber(
              result.currentStock
            ) + "개";


          /*
           * 버튼 원상복구
           */

          button.disabled = false;

          button.innerText =
            "🟢 입고 등록";


          /*
           * 입력값 초기화
           */

          document.getElementById(
            "inboundQuantity"
          ).value = 1;


          /*
           * 실제 매입가는
           * 현재 등록한 가격 그대로 유지
           */

          document.getElementById(
            "inboundSupplier"
          ).value = "";


        }

        else {

          alert(
            "❌ 입고 등록 실패\n\n" +
            (
              result &&
              result.message
                ? result.message
                : "알 수 없는 오류"
            )
          );


          button.disabled = false;

          button.innerText =
            "🟢 입고 등록";

        }

      }

      catch(error) {

        console.error(error);


        alert(
          "입고 등록 결과를 처리하는 중 오류가 발생했습니다."
        );


        button.disabled = false;

        button.innerText =
          "🟢 입고 등록";

      }


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  /*
   * API 호출
   */

  const script =
    document.createElement("script");


  const url =
    ERP_API_URL +
    "?action=inbound" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&quantity=" +
    encodeURIComponent(quantity) +
    "&purchasePrice=" +
    encodeURIComponent(purchasePrice) +
    "&supplier=" +
    encodeURIComponent(supplier) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  console.log(
    "입고등록 API 요청:",
    url
  );


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      button.disabled = false;

      button.innerText =
        "🟢 입고 등록";


      alert(
        "❌ ERP 서버에 연결할 수 없습니다."
      );

    };


  document.body.appendChild(script);

}

</script>
