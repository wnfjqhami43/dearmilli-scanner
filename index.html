<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>디어밀리 ERP 바코드 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    .status {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
    }

    .barcode {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
      white-space: pre-line;
    }

    .product {
      margin-top: 15px;
      padding: 18px;
      background: white;
      border-radius: 12px;
      line-height: 1.8;
    }

    .product-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 6px 0;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: bold;
      text-align: right;
      margin-left: 15px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .success {
      color: #16803c;
    }

    .warning {
      color: #c77700;
    }

    .error {
      color: #c62828;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 디어밀리 ERP</h1>


  <!-- 카메라 -->

  <div id="reader"></div>


  <!-- 상태 -->

  <div id="status"
       class="status">

    아래 버튼을 눌러 카메라를 시작해주세요.

  </div>


  <!-- 바코드 -->

  <div id="barcode"
       class="barcode hidden">
  </div>


  <!-- 상품정보 -->

  <div id="product"
       class="product hidden">

    <div class="product-title">
      📦 상품정보
    </div>

    <div class="row">
      <span class="label">SKU</span>
      <span class="value" id="sku"></span>
    </div>

    <div class="row">
      <span class="label">브랜드</span>
      <span class="value" id="brand"></span>
    </div>

    <div class="row">
      <span class="label">모델명</span>
      <span class="value" id="modelName"></span>
    </div>

    <div class="row">
      <span class="label">모델코드</span>
      <span class="value" id="modelCode"></span>
    </div>

    <div class="row">
      <span class="label">사이즈</span>
      <span class="value" id="size"></span>
    </div>

    <div class="row">
      <span class="label">성별</span>
      <span class="value" id="gender"></span>
    </div>

    <div class="row">
      <span class="label">상품DB 매입가</span>
      <span class="value" id="purchasePrice"></span>
    </div>

    <div class="row">
      <span class="label">현재재고</span>
      <span class="value" id="currentStock"></span>
    </div>

  </div>


  <!-- 다시 스캔 -->

  <button id="startButton"
          onclick="startScanner()">

    📷 카메라 시작

  </button>


  <button id="againButton"
          class="hidden"
          onclick="startScanner()">

    📷 다시 스캔

  </button>

</div>



<script>


/* ==================================================
   Google Apps Script 웹앱 주소
================================================== */

const ERP_API_URL =
  "https://script.google.com/macros/s/AKfycbzXviTT0QNrWy018CzCZWpR2erIxUkpk1tPJLd117WC0Pp7-HY7Lw12YHCbj9JcNCPX/exec";


let scanner = null;

let scanned = false;


/* ==================================================
   카메라 시작
================================================== */

function startScanner() {

  scanned = false;


  document.getElementById("product")
    .classList.add("hidden");


  document.getElementById("barcode")
    .classList.add("hidden");


  document.getElementById("againButton")
    .classList.add("hidden");


  document.getElementById("startButton")
    .classList.add("hidden");


  document.getElementById("status").innerHTML =
    "📷 카메라를 시작하는 중입니다...";


  document.getElementById("status").className =
    "status";


  if (scanner) {

    scanner.clear()
      .catch(function() {})
      .finally(function() {

        createScanner();

      });

  } else {

    createScanner();

  }

}


/* ==================================================
   스캐너 생성
================================================== */

function createScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 280,
        height: 120
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]

    },

    function(decodedText) {

      onScanSuccess(decodedText);

    },

    function(errorMessage) {

      // 계속 스캔 중이므로 무시

    }

  )

  .then(function() {

    document.getElementById("status").innerHTML =
      "📷 카메라가 켜졌습니다.<br>" +
      "상품 바코드를 화면 안에 맞춰주세요.";

  })

  .catch(function(error) {

    console.log(error);


    document.getElementById("status").innerHTML =
      "❌ 카메라를 사용할 수 없습니다.<br><br>" +
      "카메라 권한을 확인해주세요.";


    document.getElementById("status").className =
      "status error";


    document.getElementById("startButton")
      .classList.remove("hidden");

  });

}


/* ==================================================
   바코드 인식
================================================== */

function onScanSuccess(decodedText) {

  if (scanned) return;

  scanned = true;


  const barcode =
    String(decodedText).trim();


  document.getElementById("barcode")
    .classList.remove("hidden");


  document.getElementById("barcode").innerText =
    "인식된 바코드\n" + barcode;


  document.getElementById("status").innerHTML =
    "🔍 상품DB에서 상품을 검색하는 중입니다...";


  document.getElementById("status").className =
    "status";


  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(error);

      });

  }


  searchProduct(barcode);

}


/* ==================================================
   상품DB 검색
================================================== */

function searchProduct(barcode) {


  /*
   * JSONP용 고유 callback 이름
   */

  const callbackName =
    "barcodeCallback_" +
    Date.now();


  /*
   * 전역 callback 생성
   */

  window[callbackName] =
    function(result) {

      try {

        showProductResult(result);

      }

      finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    };


  /*
   * Google Apps Script API 호출
   */

  const script =
    document.createElement("script");


  script.src =
    ERP_API_URL +
    "?action=product" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      document.getElementById("status").innerHTML =
        "❌ ERP 서버에 연결할 수 없습니다.";

      document.getElementById("status").className =
        "status error";


      document.getElementById("againButton")
        .classList.remove("hidden");

    };


  document.body.appendChild(script);

}


/* ==================================================
   상품 검색 결과
================================================== */

function showProductResult(result) {


  if (!result) {

    showError(
      "상품 검색 결과가 없습니다."
    );

    return;

  }


  /*
   * 서버 오류
   */

  if (!result.success) {

    showError(
      result.message ||
      "상품 검색에 실패했습니다."
    );

    return;

  }


  /*
   * 등록된 상품
   */

  if (result.registered) {

    const p =
      result.product;


    document.getElementById("status").innerHTML =
      "✅ 상품DB에서 상품을 찾았습니다.";

    document.getElementById("status").className =
      "status success";


    document.getElementById("sku").innerText =
      p.sku || "-";


    document.getElementById("brand").innerText =
      p.brand || "-";


    document.getElementById("modelName").innerText =
      p.modelName || "-";


    document.getElementById("modelCode").innerText =
      p.modelCode || "-";


    document.getElementById("size").innerText =
      p.size || "-";


    document.getElementById("gender").innerText =
      p.gender || "-";


    document.getElementById("purchasePrice").innerText =
      formatNumber(p.purchasePrice) +
      "원";


    document.getElementById("currentStock").innerText =
      formatNumber(p.currentStock) +
      "개";


    document.getElementById("product")
      .classList.remove("hidden");


  }

  /*
   * 미등록 상품
   */

  else {

    document.getElementById("status").innerHTML =
      "⚠️ 상품DB에 없는 바코드입니다.<br>" +
      "신규 상품으로 등록할 수 있습니다.";

    document.getElementById("status").className =
      "status warning";

  }


  document.getElementById("againButton")
    .classList.remove("hidden");

}


/* ==================================================
   오류 표시
================================================== */

function showError(message) {

  document.getElementById("status").innerHTML =
    "❌ " + message;


  document.getElementById("status").className =
    "status error";


  document.getElementById("againButton")
    .classList.remove("hidden");

}


/* ==================================================
   숫자 표시
================================================== */

function formatNumber(value) {

  const number =
    Number(value) || 0;


  return number.toLocaleString("ko-KR");

}

</script>

</body>
</html>
