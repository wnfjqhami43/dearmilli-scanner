<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>디어밀리 ERP 바코드 스캐너</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    .status {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }

    .barcode {
      margin-top: 15px;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
      white-space: pre-line;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #1f4e78;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📷 디어밀리 ERP</h1>

  <div id="reader"></div>

  <div id="status" class="status">
    아래 버튼을 눌러 카메라를 시작해주세요.
  </div>

  <div id="barcode"
       class="barcode"
       style="display:none;">
  </div>

  <button id="startButton"
          onclick="startScanner()">
    📷 카메라 시작
  </button>

  <button id="againButton"
          style="display:none;"
          onclick="startScanner()">
    📷 다시 스캔
  </button>

</div>


<script>

let scanner = null;
let scanned = false;


/* =========================================
   카메라 시작
========================================= */

function startScanner() {

  scanned = false;

  document.getElementById("status").innerHTML =
    "📷 카메라를 시작하는 중입니다...";

  document.getElementById("status").className =
    "status";

  document.getElementById("barcode").style.display =
    "none";

  document.getElementById("againButton").style.display =
    "none";

  document.getElementById("startButton").style.display =
    "none";


  if (scanner) {

    scanner.clear()
      .catch(function() {})
      .finally(function() {

        createScanner();

      });

  } else {

    createScanner();

  }

}


/* =========================================
   스캐너 생성
========================================= */

function createScanner() {

  scanner = new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 280,
        height: 120
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39

      ]
    },

    function(decodedText) {

      onScanSuccess(decodedText);

    },

    function(errorMessage) {

      // 계속 스캔 중이므로 오류 메시지는 표시하지 않음

    }

  )

  .then(function() {

    document.getElementById("status").innerHTML =
      "📷 카메라가 켜졌습니다.<br>" +
      "상품 바코드를 화면 안에 맞춰주세요.";

  })

  .catch(function(error) {

    console.log(error);

    document.getElementById("status").innerHTML =
      "❌ 카메라를 사용할 수 없습니다.<br><br>" +
      "휴대폰 브라우저에서 카메라 권한을 허용해주세요.";

    document.getElementById("status").className =
      "status error";

    document.getElementById("startButton").style.display =
      "block";

  });

}


/* =========================================
   바코드 인식
========================================= */

function onScanSuccess(decodedText) {

  if (scanned) return;

  scanned = true;


  const barcode =
    String(decodedText).trim();


  document.getElementById("barcode").style.display =
    "block";

  document.getElementById("barcode").innerText =
    "인식된 바코드\n" + barcode;


  document.getElementById("status").innerHTML =
    "✅ 바코드 인식 성공!";

  document.getElementById("status").className =
    "status success";


  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(error);

      });

  }


  document.getElementById("againButton").style.display =
    "block";

}

</script>

</body>
</html>
</script>

</body>
</html>
