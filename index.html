<script>


/* ==========================================
   ERP 웹앱 주소
========================================== */

const ERP_API_URL =
"https://script.google.com/macros/s/AKfycbzXviTT0QNrWy018CzCZWpR2erIxUkpk1tPJLd117WC0Pp7-HY7Lw12YHCbj9JcNCPX/exec";


let scanner = null;

let scanned = false;


/* ==========================================
   카메라 시작
========================================== */

function startScanner() {

  scanned = false;


  document
    .getElementById("product")
    .classList.add("hidden");


  document
    .getElementById("barcode")
    .classList.add("hidden");


  document
    .getElementById("againButton")
    .classList.add("hidden");


  document
    .getElementById("startButton")
    .classList.add("hidden");


  setStatus(
    "📷 카메라를 시작하는 중입니다...",
    ""
  );


  if (scanner) {

    scanner.clear()
      .catch(function() {})
      .finally(function() {

        createScanner();

      });

  } else {

    createScanner();

  }

}


/* ==========================================
   스캐너 생성
========================================== */

function createScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
    width: 280,
    height: 120
     },
      
      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]
    },

    function(decodedText) {

      onScanSuccess(decodedText);

    },

    function(errorMessage) {

      // 계속 스캔 중이므로 무시

    }

  )

  .then(function() {

    setStatus(
      "📷 카메라가 켜졌습니다.<br>" +
      "상품 바코드를 화면 안에 맞춰주세요.",
      ""
    );

  })

  .catch(function(error) {

    console.log(error);

    setStatus(
      "❌ 카메라를 사용할 수 없습니다.<br><br>" +
      "카메라 권한을 확인해주세요.",
      "error"
    );

    document
      .getElementById("startButton")
      .classList.remove("hidden");

  });

}


/* ==========================================
   바코드 인식
========================================== */

function onScanSuccess(decodedText) {

  if (scanned) return;

  scanned = true;


  const barcode =
    String(decodedText).trim();


  document
    .getElementById("barcode")
    .classList.remove("hidden");


  document
    .getElementById("barcode")
    .innerText =
      "인식된 바코드\n" + barcode;


  setStatus(
    "🔍 상품DB에서 상품을 검색하는 중입니다...",
    ""
  );


  if (scanner) {

    scanner.stop()
      .catch(function(error) {

        console.log(error);

      });

  }


  searchProduct(barcode);

}


/* ==========================================
   상품DB 검색
========================================== */

function searchProduct(barcode) {


  /*
   * 매번 새로운 callback 이름 생성
   */

  const callbackName =
    "dearmilliCallback_" +
    Date.now();


  /*
   * timeout
   */

  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;


      if (window[callbackName]) {

        delete window[callbackName];

      }


      setStatus(
        "❌ ERP 서버 응답 시간이 초과되었습니다.<br><br>" +
        "잠시 후 다시 스캔해주세요.",
        "error"
      );


      document
        .getElementById("againButton")
        .classList.remove("hidden");


    }, 15000);


  /*
   * JSONP callback
   */

  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


     try {

  showProductResult(result);

}

catch(error) {

  console.error(
    "상품정보 표시 오류:",
    error
  );

  /*
   * 상품정보가 이미 정상적으로 표시된 경우에는
   * 전체 화면을 오류 상태로 바꾸지 않는다.
   */

  const productBox =
    document.getElementById("product");

  if (
    !productBox ||
    productBox.classList.contains("hidden")
  ) {

    setStatus(
      "❌ 상품정보를 표시하는 중 오류가 발생했습니다.",
      "error"
    );

  }

}


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  /*
   * API script 생성
   */

  const script =
    document.createElement("script");


  const url =
    ERP_API_URL +
    "?action=product" +
    "&barcode=" +
    encodeURIComponent(barcode) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  console.log("API 요청:", url);


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      delete window[callbackName];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }


      setStatus(
        "❌ ERP 서버에 연결할 수 없습니다.<br><br>" +
        "API 응답을 확인해주세요.",
        "error"
      );


      document
        .getElementById("againButton")
        .classList.remove("hidden");

    };


  document.body.appendChild(script);

}


/* ==========================================
   상품 검색 결과
========================================== */

function showProductResult(result) {


  console.log("상품 검색 결과:", result);


  if (!result) {

    showError(
      "상품 검색 결과가 없습니다."
    );

    return;

  }


  if (!result.success) {

function loadSalesPlatforms() {

  const select =
    document.getElementById("salesPlatform");

  if (!select) return;


  const callbackName =
    "salesPlatformsCallback_" +
    Date.now();


  let finished = false;


  const script =
    document.createElement("script");


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      select.innerHTML =
        '<option value="">판매처를 불러오지 못했습니다.</option>';

    }, 15000);


  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      try {

        select.innerHTML =
          '<option value="">판매처 선택</option>';


        if (
          result &&
          result.success &&
          Array.isArray(result.platforms)
        ) {

          result.platforms.forEach(function(platform) {

            const option =
              document.createElement("option");

            option.value =
              platform.name;

            option.textContent =
              platform.name;

            select.appendChild(option);

          });


          if (result.platforms.length === 0) {

            select.innerHTML =
              '<option value="">등록된 판매처가 없습니다.</option>';

          }

        }

        else {

          select.innerHTML =
            '<option value="">판매처를 불러오지 못했습니다.</option>';

        }

      }

      catch(error) {

        console.error(
          "판매처 목록 오류:",
          error
        );

        select.innerHTML =
          '<option value="">판매처를 불러오지 못했습니다.</option>';

      }


      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


  const url =
    ERP_API_URL +
    "?action=salesPlatforms" +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&t=" +
    Date.now();


  console.log(
    "판매처 목록 API 요청:",
    url
  );


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      select.innerHTML =
        '<option value="">판매처를 불러오지 못했습니다.</option>';

    };


  document.body.appendChild(script);

}

      clearTimeout(timeout);

      delete window[callbackName];

      button.disabled = false;

      button.innerText =
        "🆕 상품DB에 등록";

      alert(
        "❌ ERP 서버에 연결할 수 없습니다."
      );

    };


  document
    .body
    .appendChild(script);

}
// ========================================
// SKU 자동생성
// ========================================

function generateNewProductSku() {

  const brandSelect =
    document.getElementById(
      "newProductBrand"
    );

  const modelCode =
    document
      .getElementById(
        "newProductModelCode"
      )
      .value
      .trim();

  const size =
    document
      .getElementById(
        "newProductSize"
      )
      .value
      .trim();

  const skuInput =
    document.getElementById(
      "newProductSku"
    );


  const selectedOption =
    brandSelect.options[
      brandSelect.selectedIndex
    ];


  const brandCode =
    selectedOption
      ? selectedOption.dataset.code || ""
      : "";


  const cleanModelCode =
    modelCode
      .replace(/-/g, "")
      .replace(/\s+/g, "");


  const cleanSize =
    size
      .replace(/\s+/g, "");


  if (
    !brandCode ||
    !cleanModelCode ||
    !cleanSize
  ) {

    skuInput.value = "";

    return;

  }


  skuInput.value =
    brandCode +
    "-" +
    cleanModelCode +
    "-" +
    cleanSize;

}
  // ========================================
// 상품등록 옵션 불러오기
// ========================================

function loadProductOptions() {

  const callbackName =
    "productOptionsCallback_" +
    Date.now();

  const script =
    document.createElement("script");

  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      console.error(
        "상품등록 옵션 불러오기 시간 초과"
      );

    }, 15000);


  window[callbackName] =
    function(result) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);


      try {

        if (
          !result ||
          !result.success
        ) {

          console.error(
            "상품등록 옵션 오류:",
            result
          );

          return;

        }


        // -------------------------------
        // 브랜드
        // -------------------------------

        const brandSelect =
          document.getElementById(
            "newProductBrand"
          );


        if (brandSelect) {

          brandSelect.innerHTML =
            '<option value="">브랜드 선택</option>';


          (result.brands || [])
            .forEach(function(brand) {

              const option =
                document.createElement("option");

              option.value =
                brand.name;

              option.textContent =
                brand.name;

              option.dataset.code =
                brand.code || "";

              brandSelect.appendChild(
                option
              );

            });

        }


        // -------------------------------
        // 카테고리
        // -------------------------------

        const categorySelect =
          document.getElementById(
            "newProductCategory"
          );


        if (categorySelect) {

          categorySelect.innerHTML =
            '<option value="">카테고리 선택</option>';


          (result.categories || [])
            .forEach(function(category) {

              const option =
                document.createElement("option");

              option.value =
                category;

              option.textContent =
                category;

              categorySelect.appendChild(
                option
              );

            });

        }


        // -------------------------------
        // 성별
        // -------------------------------

        const genderSelect =
          document.getElementById(
            "newProductGender"
          );


        if (genderSelect) {

          genderSelect.innerHTML =
            '<option value="">성별 선택</option>';


          (result.genders || [])
            .forEach(function(gender) {

              const option =
                document.createElement("option");

              option.value =
                gender;

              option.textContent =
                gender;

              genderSelect.appendChild(
                option
              );

            });

        }

      }

      catch(error) {

        console.error(
          "상품등록 옵션 처리 오류:",
          error
        );

      }


      delete window[callbackName];


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

    };


  const url =
    ERP_API_URL +
    "?action=productOptions" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  console.log(
    "상품등록 옵션 API 요청:",
    url
  );


  script.src = url;


  script.onerror =
    function() {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      console.error(
        "상품등록 옵션 서버 연결 실패"
      );

    };


  document
    .body
    .appendChild(script);

}
